# Genclarus CI — the automated gate every push/PR to main must pass.
#
# Four jobs so a failure names exactly what broke:
#   build-test  — the correctness gate: full test suite + a clean production build.
#   audit       — dependency vulnerability scan (fails on high/critical advisories).
#   secret-scan — gitleaks scans the history/diff for committed credentials (free on public repos).
#   provenance  — SCHEDULED only: re-audits every shipped claim against the live sources. Kept off
#                 the push path on purpose; see the job for why.
#
# All free on a public repo. No secrets are needed to build — the app reads its keys at runtime,
# never at build time, so CI never touches production credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:20 UTC daily. The provenance audit reads live upstream records, so a nightly run also
    # catches the case where an UPSTREAM change (a ClinVar reclassification, a withdrawn record)
    # breaks grounding without a single line of our code changing.
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck # full tsc --noEmit — catches type errors in test files that next build/vitest skip
      - run: npm test
      - run: npx next build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hard-fail on CRITICAL advisories only. High/moderate advisories are triaged as reviewable
      # Dependabot PRs instead — the current highs are transitive through Next's image tooling
      # (sharp/libvips) and are resolved by a Next patch, so hard-failing every push on them would
      # wedge CI red until an unrelated framework bump. The full report still prints for visibility.
      - run: npm audit || true
      - run: npm audit --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The provenance invariant: every shipped claim must cite fact ids that resolve, and no claim
  # may be authored by a language model. Deliberately NOT in build-test — this harness calls the
  # live upstream APIs (MyGene, ClinVar, dbSNP, gnomAD), so on a per-push job an upstream blip
  # would fail a build for a reason that has nothing to do with the change. On a schedule, a
  # network flake fails a cron run and nothing else, and a REAL regression still gets caught
  # within a day. It needs no API key and calls no model.
  provenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run measure:provenance
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provenance-report
          path: docs/validation/provenance.json
          if-no-files-found: error
